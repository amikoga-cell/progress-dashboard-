  <!DOCTYPE html>                                                                                                                                                                                              
  <html>          
  <head>                                                                                                                                                                                                       
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理ギフトカード 進捗ダッシュボード</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Hiragino Sans', 'メイリオ', sans-serif; background: #f5f7fa; color: #333; }
      header { background: #2c3e50; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
      header h1 { font-size: 18px; }
      .tab-nav { background: #1a252f; display: flex; padding: 0 24px; }
      .tab-btn { padding: 10px 24px; color: rgba(255,255,255,0.55); cursor: pointer; font-size: 13px; font-weight: bold; border-bottom: 3px solid transparent; transition: all 0.2s; user-select: none; }
      .tab-btn.active { color: white; border-bottom-color: #3498db; }
      .tab-btn:hover:not(.active) { color: rgba(255,255,255,0.85); }
      .tab-content { display: none; }
      .tab-content.active { display: block; }
      .controls { padding: 16px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
      .btn-primary { background: #3498db; color: white; }
      .btn-secondary { background: #ecf0f1; color: #333; }
      .btn-success { background: #27ae60; color: white; }
      .btn:hover { opacity: 0.85; }
      .stats { display: flex; gap: 16px; padding: 0 24px 16px; flex-wrap: wrap; }
      .stat-card { background: white; border-radius: 8px; padding: 12px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); text-align: center; flex: 1; min-width: 80px; }
      .stat-card .num { font-size: 28px; font-weight: bold; }
      .stat-card .label { font-size: 11px; color: #999; margin-top: 2px; }
      .num-弊社ボール { color: #e74c3c; }
      .num-先方待ち { color: #e6ac00; }
      .num-完了社 { color: #27ae60; }
      .num-total { color: #3498db; }
      .num-合意 { color: #f39c12; }
      .table-wrap { padding: 0 24px 24px; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
      th { background: #2c3e50; color: white; padding: 10px 12px; font-size: 12px; text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
      th:first-child { text-align: left; min-width: 150px; position: sticky; left: 0; z-index: 2; }
      td { padding: 8px 12px; border-bottom: 1px solid #ecf0f1; text-align: center; font-size: 12px; vertical-align: middle; }
      td:first-child { text-align: left; font-weight: bold; background: white; position: sticky; left: 0; z-index: 1; }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #f8f9fa; }
      tr:hover td:first-child { background: #f8f9fa; }
      .status-select { border: none; border-radius: 12px; padding: 4px 8px; font-size: 11px; font-weight: bold; cursor: pointer; outline: none; -webkit-appearance: none; appearance: none; text-align: center;
   min-width: 80px; }
      .status-未着手 { background: #e0e0e0; color: #666; }
      .status-弊社ボール { background: #e74c3c; color: white; }
      .status-先方待ち { background: #f1c40f; color: #333; }
      .status-完了 { background: #2ecc71; color: white; }
      .kakudo-select { border: none; border-radius: 12px; padding: 4px 8px; font-size: 11px; font-weight: bold; cursor: pointer; outline: none; -webkit-appearance: none; appearance: none; text-align: center;
   min-width: 80px; }
      .kakudo-アプローチ中 { background: #e0e0e0; color: #666; }
      .kakudo-商談中 { background: #3498db; color: white; }
      .kakudo-提案済み { background: #9b59b6; color: white; }
      .kakudo-口頭合意 { background: #f39c12; color: white; }
      .kakudo-契約締結 { background: #27ae60; color: white; }
      .item-tag { display: inline-block; background: #eaf4ff; color: #3498db; border-radius: 4px; padding: 2px 6px; font-size: 10px; margin: 1px; }
      .item-cell { cursor: pointer; min-width: 80px; }
      .item-cell:hover { opacity: 0.7; }
      .item-empty { color: #ccc; }
      .memo-cell { cursor: pointer; min-width: 180px; max-width: 180px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: #666; line-height: 1.4; text-align:
   left; }
      .memo-cell:hover { color: #3498db; }
      .memo-empty { color: #ccc; }
      .url-cell { cursor: pointer; text-align: center; min-width: 60px; }
      .diff-plus { color: #27ae60; font-weight: bold; }
      .diff-minus { color: #e74c3c; font-weight: bold; }
      .company-done td { opacity: 0.45; }
      .company-done td:first-child { text-decoration: line-through; }
      .loading { text-align: center; padding: 48px; color: #999; font-size: 14px; }
      .btn-juchu { background: white; color: #666; padding: 4px 10px; border: 1px solid #bbb; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; white-space: nowrap; }
      .btn-juchu:hover { background: #27ae60; color: white; border-color: #27ae60; }
      .card-list { display: none; padding: 0 16px 24px; }
      .company-card { background: white; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
      .card-header { background: #2c3e50; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
      .card-header .company-name { font-size: 14px; font-weight: bold; }
      .card-header .card-toggle { font-size: 18px; transition: transform 0.2s; }
      .card-header.open .card-toggle { transform: rotate(180deg); }
      .card-body { padding: 12px 16px; display: none; }
      .card-body.open { display: block; }
      .card-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
      .card-row:last-child { border-bottom: none; }
      .card-label { color: #999; font-size: 11px; min-width: 120px; }
      .card-value { text-align: right; flex: 1; }
      .card-tasks { margin-top: 8px; }
      .card-task-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #f5f5f5; font-size: 12px; }
      .card-task-row:last-child { border-bottom: none; }
      .card-task-name { color: #666; }
      .card-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 18px; padding: 0 4px; }
      .card-done { opacity: 0.45; }
      .card-done .company-name { text-decoration: line-through; }
      .modal-overlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
      .modal-overlay.show { display: flex; }
      .modal { background: white; padding: 24px; border-radius: 8px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
      .modal h2 { margin-bottom: 12px; font-size: 16px; }
      .modal p { font-size: 12px; color: #999; margin-bottom: 12px; }
      .modal label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
      .modal input[type="text"], .modal input[type="number"], .modal input[type="date"], .modal input[type="password"], .modal input[type="url"], .modal textarea, .modal select { width: 100%; padding: 8px
  12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; background: white; }
      .modal textarea { height: 80px; resize: vertical; font-family: inherit; }
      .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
      .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #333; cursor: pointer; background: #f5f7fa; padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd;
  margin-bottom: 0; }
      .checkbox-group input[type="checkbox"] { width: auto; margin: 0; }
      .checkbox-group label:hover { background: #eaf4ff; border-color: #3498db; }
      @media (max-width: 768px) {
        header { padding: 12px 16px; }
        header h1 { font-size: 15px; }
        .tab-nav { padding: 0 16px; }
        .tab-btn { padding: 8px 16px; font-size: 12px; }
        .controls { padding: 12px 16px; gap: 8px; }
        .btn { padding: 7px 12px; font-size: 12px; }
        .stats { padding: 0 16px 12px; gap: 8px; }
        .stat-card { padding: 10px 12px; }
        .stat-card .num { font-size: 22px; }
        .table-wrap { display: none; }
        .card-list { display: block; }
      }
    </style>
  </head>
  <body>

  <header>
    <h1>物理ギフトカード 進捗ダッシュボード</h1>
    <div style="font-size:12px;opacity:0.7" id="lastUpdated"></div>
  </header>

  <div class="tab-nav">
    <div class="tab-btn active" id="tabBtn-prospects" onclick="switchTab('prospects')">受注前</div>
    <div class="tab-btn" id="tabBtn-orders" onclick="switchTab('orders')">受注済み</div>
  </div>

  <div class="tab-content active" id="tab-prospects">
    <div class="controls">
      <button class="btn btn-success" onclick="openAddProspectModal()">＋ 案件を追加</button>
    </div>
    <div class="stats" id="prospectStatsArea"></div>
    <div class="table-wrap">
      <div class="loading" id="prospectLoading">読み込み中...</div>
      <table id="prospectTable" style="display:none">
        <thead id="prospectHead"></thead>
        <tbody id="prospectBody"></tbody>
      </table>
    </div>
    <div class="card-list" id="prospectCardList"></div>
  </div>

  <div class="tab-content" id="tab-orders">
    <div class="controls">
      <button class="btn btn-success" onclick="openAddModal()">＋ 事業者を追加</button>
      <button class="btn btn-secondary" id="toggleBtn" onclick="toggleCompleted()">完了済みを表示</button>
      <a class="btn btn-success" href="https://docs.google.com/spreadsheets/d/1rJLqwog14dUinNtqkTt1sCngtFOwfDYOpXSKute92jg/edit?gid=800499023#gid=800499023" target="_blank" 
  style="text-decoration:none;">見積書スプレッドシート</a>
    </div>
    <div class="stats" id="statsArea"></div>
    <div class="table-wrap">
      <div class="loading" id="loading">読み込み中...</div>
      <table id="dashTable" style="display:none">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="card-list" id="cardList"></div>
  </div>

  <!-- トークンモーダル -->
  <div class="modal-overlay" id="tokenModal">
    <div class="modal">
      <h2>GitHubトークンを入力</h2>
      <p>初回のみ必要です。ブラウザに保存されます。</p>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" />
      <div class="modal-btns"><button class="btn btn-primary" onclick="saveToken()">保存して開始</button></div>
    </div>
  </div>

  <!-- 事業者追加モーダル（受注済み） -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>事業者を追加</h2>
      <label>事業者名</label>
      <input type="text" id="newCompanyName" placeholder="例：株式会社〇〇" />
      <label>担当者</label>
      <input type="text" id="newTantousha" placeholder="例：山田 太郎" />
      <label>発行枚数</label>
      <input type="number" id="newHakkouMaisuu" placeholder="例：1000" />
      <label>デザイン数</label>
      <input type="number" id="newDesignSuu" placeholder="例：3" />
      <label>発注内容</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="newHatchuu" value="カード"> カード</label>
        <label><input type="checkbox" name="newHatchuu" value="封筒"> 封筒</label>
        <label><input type="checkbox" name="newHatchuu" value="台紙"> 台紙</label>
        <label><input type="checkbox" name="newHatchuu" value="化粧箱"> 化粧箱</label>
      </div>
      <label>納品日</label>
      <input type="date" id="newNouhinbi" />
      <label>提示見積もり金額（円）</label>
      <input type="number" id="newMitsumoriKingaku" placeholder="例：500000" />
      <label>印刷会社見積もり金額（円）</label>
      <input type="number" id="newInsatsuMitsumori" placeholder="例：300000" />
      <label>見積書URL</label>
      <input type="url" id="newMitsumoriURL" placeholder="https://..." />
      <label>備考</label>
      <textarea id="newMemo" placeholder="任意"></textarea>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAddModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="addCompany()">追加</button>
      </div>
    </div>
  </div>

  <!-- 案件追加モーダル（受注前） -->
  <div class="modal-overlay" id="addProspectModal">
    <div class="modal">
      <h2>案件を追加</h2>
      <label>会社名</label>
      <input type="text" id="pName" placeholder="例：株式会社〇〇" />
      <label>アポ日</label>
      <input type="date" id="pAppoDate" />
      <label>担当者</label>
      <input type="text" id="pTantousha" placeholder="例：山田 太郎" />
      <label>確度</label>
      <select id="pKakudo">
        <option value="アプローチ中">アプローチ中</option>
        <option value="商談中">商談中</option>
        <option value="提案済み">提案済み</option>
        <option value="口頭合意">口頭合意</option>
        <option value="契約締結">契約締結</option>
      </select>
      <label>見込みGMV（円）</label>
      <input type="number" id="pMikomiGMV" placeholder="例：1000000" />
      <label>見積もり金額（円）</label>
      <input type="number" id="pMitsumori" placeholder="例：500000" />
      <label>見積書URL</label>
      <input type="url" id="pMitsumoriURL" placeholder="https://..." />
      <label>ネクストアクション</label>
      <input type="text" id="pNextAction" placeholder="次にやること" />
      <label>備考</label>
      <textarea id="pJokyo" placeholder="備考を記入"></textarea>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAddProspectModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="addProspect()">追加</button>
      </div>
    </div>
  </div>

  <!-- 備考モーダル（受注済み） -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal">
      <h2 id="memoModalTitle">備考</h2>
      <textarea id="memoInput" placeholder="備考を入力"></textarea>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeMemoModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveMemo()">保存</button>
      </div>
    </div>
  </div>

  <!-- 発注内容モーダル -->
  <div class="modal-overlay" id="hatcuuModal">
    <div class="modal">
      <h2 id="hatchuuModalTitle">発注内容</h2>
      <div class="checkbox-group">
        <label><input type="checkbox" name="editHatchuu" value="カード"> カード</label>
        <label><input type="checkbox" name="editHatchuu" value="封筒"> 封筒</label>
        <label><input type="checkbox" name="editHatchuu" value="台紙"> 台紙</label>
        <label><input type="checkbox" name="editHatchuu" value="化粧箱"> 化粧箱</label>
      </div>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeHatchuuModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveHatchuu()">保存</button>
      </div>
    </div>
  </div>

  <!-- 備考モーダル（受注前） -->
  <div class="modal-overlay" id="jokyoModal">
    <div class="modal">
      <h2 id="jokyoModalTitle">備考</h2>
      <textarea id="jokyoInput" placeholder="備考を入力"></textarea>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeJokyoModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveJokyo()">保存</button>
      </div>
    </div>
  </div>

  <!-- URL編集モーダル -->
  <div class="modal-overlay" id="urlModal">
    <div class="modal">
      <h2 id="urlModalTitle">見積書URL</h2>
      <input type="url" id="urlInput" placeholder="https://..." />
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeUrlModal()">キャンセル</button>
        <button class="btn btn-secondary" id="urlOpenBtn" onclick="openUrlInModal()" style="display:none">開く</button>
        <button class="btn btn-primary" onclick="saveUrl()">保存</button>
      </div>
    </div>
  </div>

      <script>                                                                                                                                                                                                   
      var GIST_ID = '2bf253d3446c8999d088826891a2073c';
      var STATUSES = ['未着手', '弊社ボール', '先方待ち', '完了'];                                                                                                                                             
      var KAKUDO_LIST = ['アプローチ中', '商談中', '提案済み', '口頭合意', '契約締結'];                                                                                                                      
      var TASKS = ['発行枚数確定', 'デザイン数確定', '見積もり送付', '発注書締結', '商品登録', 'URL発行・共有', 'デザイン共有', '印刷会社へ発注', '納品'];
      var allData = [], prospects = [], showCompleted = false, token = '';
      var memoTargetName = '', hatchuuTargetName = '', jokyoTargetName = '';
      var urlTarget = { type: '', name: '' };

      function init() {
        token = localStorage.getItem('gh_token') || '';
        if (!token) { document.getElementById('tokenModal').classList.add('show'); return; }
        loadData();
      }
      function saveToken() {
        var t = document.getElementById('tokenInput').value.trim();
        if (!t) { alert('トークンを入力してください'); return; }
        localStorage.setItem('gh_token', t); token = t;
        document.getElementById('tokenModal').classList.remove('show');
        loadData();
      }
      function switchTab(tab) {
        ['prospects','orders'].forEach(function(t) {
          document.getElementById('tab-'+t).classList.toggle('active', t===tab);
          document.getElementById('tabBtn-'+t).classList.toggle('active', t===tab);
        });
      }
      function loadData() {
        var cached = localStorage.getItem('dashboard_cache');
        if (cached) {
          try {
            var pc = JSON.parse(cached);
            allData = pc.companies || []; prospects = pc.prospects || [];
            render();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashTable').style.display = 'table';
            document.getElementById('prospectLoading').style.display = 'none';
            document.getElementById('prospectTable').style.display = 'table';
            document.getElementById('lastUpdated').textContent = '更新確認中...';
          } catch(e) {}
        }
        fetch('https://api.github.com/gists/' + GIST_ID, { headers: { 'Authorization': 'token ' + token } })
        .then(function(r) { return r.text(); })
        .then(function(text) {
          var data = JSON.parse(text);
          var content = data.files['data.json'].content;
          var parsed = JSON.parse(content);
          allData = parsed.companies || []; prospects = parsed.prospects || [];
          localStorage.setItem('dashboard_cache', content);
          render();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashTable').style.display = 'table';
          document.getElementById('prospectLoading').style.display = 'none';
          document.getElementById('prospectTable').style.display = 'table';
          updateTime();
        })
        .catch(function(e) {
          if (!cached) {
            document.getElementById('loading').textContent = 'エラー: ' + e.message;
            document.getElementById('prospectLoading').textContent = 'エラー: ' + e.message;
          }
        });
      }
      function saveData() {
        return fetch('https://api.github.com/gists/' + GIST_ID, {
          method: 'PATCH',
          headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: { 'data.json': { content: JSON.stringify({ companies: allData, prospects: prospects }, null, 2) } } })
        });
      }
      function isAllDone(c) { return TASKS.every(function(t) { return c.tasks[t] === '完了'; }); }
      function render() {
        renderStats(); renderTable(); renderCards();
        renderProspectStats(); renderProspectTable(); renderProspectCards();
      }
      function renderStats() {
        var active = allData.filter(function(c) { return !isAllDone(c); });
        var ourBall = 0, waiting = 0;
        active.forEach(function(c) {
          TASKS.forEach(function(t) {
            if (c.tasks[t] === '弊社ボール') ourBall++;
            if (c.tasks[t] === '先方待ち') waiting++;
          });
        });
        var totalMitsumori = allData.filter(function(c){ return showCompleted||!isAllDone(c); }).reduce(function(s,c){ return s+(c.mitsumoriKingaku||0); },0);
        document.getElementById('statsArea').innerHTML =
          '<div class="stat-card"><div class="num num-弊社ボール">'+ourBall+'</div><div class="label">弊社ボール</div></div>' +
          '<div class="stat-card"><div class="num num-先方待ち">'+waiting+'</div><div class="label">先方待ち</div></div>' +
          '<div class="stat-card"><div class="num num-完了社">'+allData.filter(isAllDone).length+'</div><div class="label">完了事業者</div></div>' +
          '<div class="stat-card"><div class="num num-total" style="font-size:20px;">'+totalMitsumori.toLocaleString()+'円</div><div class="label">見積もり合計</div></div>';
      }
      function renderTable() {
        var h = '<tr><th>事業者名</th><th>担当者</th><th>発行枚数</th><th>デザイン数</th><th>発注内容</th><th>納品日</th><th>提示見積もり</th><th>印刷会社見積もり</th><th>見積書</th><th>差分</th><th>備考</th>';
        TASKS.forEach(function(t) { h += '<th>'+t+'</th>'; });
        document.getElementById('tableHead').innerHTML = h + '</tr>';
        var filtered = allData.filter(function(c) { return showCompleted || !isAllDone(c); });
        var body = '';
        filtered.forEach(function(c) {
          var memo = c.memo || '', hatchuu = c.hatchuu || [], diff = '', diffClass = '';
          if (c.mitsumoriKingaku !== undefined && c.insatsuMitsumori !== undefined) {
            var d = c.mitsumoriKingaku - c.insatsuMitsumori;
            diffClass = d >= 0 ? 'diff-plus' : 'diff-minus';

        if(!confirm(name+' を削除しますか？')) return;
        allData=allData.filter(function(c){return c.name!==name;});
        render(); saveData().catch(function(e){alert('保存失敗: '+e.message);});
      }
      function editNumber(name, field, cell) {
        var current=cell.textContent.replace(/[^0-9\-]/g,'');
        var input=document.createElement('input');
        input.type='number'; input.value=current;
        input.style.cssText='width:80px;font-size:12px;text-align:center;border:1px solid #3498db;border-radius:4px;';
        cell.textContent=''; cell.appendChild(input); input.focus();
        function save(){var company=allData.find(function(c){return c.name===name;});if(company){if(input.value!=='')company[field]=Number(input.value);else delete
  company[field];}renderTable();saveData().catch(function(e){alert('保存失敗: '+e.message);});}
        input.addEventListener('blur',save);
        input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing)input.blur();if(e.key==='Escape')renderTable();});
      }
      function editDate(name, cell) {
        var company=allData.find(function(c){return c.name===name;});
        var input=document.createElement('input');
        input.type='date'; input.value=company?(company.nouhinbi||''):'';
        input.style.cssText='font-size:12px;border:1px solid #3498db;border-radius:4px;padding:2px;';
        cell.textContent=''; cell.appendChild(input); input.focus();
        input.showPicker&&input.showPicker();
        function save(){if(company)company.nouhinbi=input.value||'';renderTable();saveData().catch(function(e){alert('保存失敗: '+e.message);});}
        input.addEventListener('blur',save);
        input.addEventListener('keydown',function(e){if(e.key==='Enter')input.blur();if(e.key==='Escape')renderTable();});
      }
      function addCompany() {
        var name=document.getElementById('newCompanyName').value.trim();
        if(!name){alert('事業者名を入力してください');return;}
        if(allData.some(function(c){return c.name===name;})){alert('すでに存在します');return;}
        var newC={name:name,tasks:{}};
        var tantousha=document.getElementById('newTantousha').value.trim();
        var hakkouMaisuu=document.getElementById('newHakkouMaisuu').value;
        var designSuu=document.getElementById('newDesignSuu').value;
        var nouhinbi=document.getElementById('newNouhinbi').value;
        var mitsumori=document.getElementById('newMitsumoriKingaku').value;
        var insatsu=document.getElementById('newInsatsuMitsumori').value;
        var url=document.getElementById('newMitsumoriURL').value.trim();
        var memo=document.getElementById('newMemo').value.trim();
        var hatchuu=[];
        document.querySelectorAll('input[name="newHatchuu"]:checked').forEach(function(cb){hatchuu.push(cb.value);});
        if(tantousha!=='') newC.tantousha=tantousha;
        if(hakkouMaisuu!=='') newC.hakkouMaisuu=Number(hakkouMaisuu);
        if(designSuu!=='') newC.designSuu=Number(designSuu);
        if(nouhinbi!=='') newC.nouhinbi=nouhinbi;
        if(mitsumori!=='') newC.mitsumoriKingaku=Number(mitsumori);
        if(insatsu!=='') newC.insatsuMitsumori=Number(insatsu);
        if(url!=='') newC.mitsumoriURL=url;
        if(memo!=='') newC.memo=memo;
        if(hatchuu.length) newC.hatchuu=hatchuu;
        TASKS.forEach(function(t){newC.tasks[t]='未着手';});
        allData.push(newC);
        render(); closeAddModal();
        saveData().catch(function(e){alert('保存失敗: '+e.message);});
      }
      function updateTime() { document.getElementById('lastUpdated').textContent='最終更新: '+new Date().toLocaleTimeString('ja-JP'); }
      function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      function escAttr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
      document.getElementById('newCompanyName').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing)addCompany();if(e.key==='Escape')closeAddModal();});
      document.getElementById('tokenInput').addEventListener('keydown',function(e){if(e.key==='Enter')saveToken();});
      init();
    </script>
    </body>
    </html>
