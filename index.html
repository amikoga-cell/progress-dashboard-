    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Hiragino Sans', 'メイリオ', sans-serif; background: #f5f7fa; color: #333; }

      header {
        background: #2c3e50; color: white;
        padding: 16px 24px;
        display: flex; align-items: center; justify-content: space-between;
      }
      header h1 { font-size: 18px; }

      .tab-nav { background: #1a252f; display: flex; padding: 0 24px; }
      .tab-btn {
        padding: 10px 24px; color: rgba(255,255,255,0.55);
        cursor: pointer; font-size: 13px; font-weight: bold;
        border-bottom: 3px solid transparent; transition: all 0.2s;
        user-select: none;
      }
      .tab-btn.active { color: white; border-bottom-color: #3498db; }
      .tab-btn:hover:not(.active) { color: rgba(255,255,255,0.85); }
      .tab-content { display: none; }
      .tab-content.active { display: block; }

      .controls { padding: 16px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
      .btn-primary { background: #3498db; color: white; }
      .btn-secondary { background: #ecf0f1; color: #333; }
      .btn-success { background: #27ae60; color: white; }
      .btn:hover { opacity: 0.85; }

      .stats { display: flex; gap: 16px; padding: 0 24px 16px; flex-wrap: wrap; }

      .num-先方待ち { color: #e6ac00; }
      .num-完了社 { color: #27ae60; }
      .num-total { color: #3498db; }
      .num-合意 { color: #f39c12; }

      .table-wrap { padding: 0 24px 24px; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
      th { background: #2c3e50; color: white; padding: 10px 12px; font-size: 12px; text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
      th:first-child { text-align: left; min-width: 150px; position: sticky; left: 0; z-index: 2; }
      td { padding: 8px 12px; border-bottom: 1px solid #ecf0f1; text-align: center; font-size: 12px; vertical-align: middle; }
      td:first-child { text-align: left; font-weight: bold; background: white; position: sticky; left: 0; z-index: 1; }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #f8f9fa; }
      tr:hover td:first-child { background: #f8f9fa; }

      .status-select {
        border: none; border-radius: 12px; padding: 4px 8px;
        font-size: 11px; font-weight: bold; cursor: pointer; outline: none;
        -webkit-appearance: none; appearance: none; text-align: center; min-width: 80px;
      }
      .status-未着手 { background: #e0e0e0; color: #666; }
      .status-弊社ボール { background: #e74c3c; color: white; }
      .status-先方待ち { background: #f1c40f; color: #333; }
      .status-完了 { background: #2ecc71; color: white; }

      .kakudo-select {
        border: none; border-radius: 12px; padding: 4px 8px;
        font-size: 11px; font-weight: bold; cursor: pointer; outline: none;
        -webkit-appearance: none; appearance: none; text-align: center; min-width: 80px;
      }
      .kakudo-アプローチ中 { background: #e0e0e0; color: #666; }
      .kakudo-商談中 { background: #3498db; color: white; }
      .kakudo-提案済み { background: #9b59b6; color: white; }
      .kakudo-口頭合意 { background: #f39c12; color: white; }
      .kakudo-契約締結 { background: #27ae60; color: white; }

      .item-tag { display: inline-block; background: #eaf4ff; color: #3498db; border-radius: 4px; padding: 2px 6px; font-size: 10px; margin: 1px; }
      .item-cell { cursor: pointer; min-width: 80px; }
      .item-cell:hover { opacity: 0.7; }
      .item-empty { color: #ccc; }

      .memo-cell {
        cursor: pointer; min-width: 180px; max-width: 180px;
        overflow: hidden; display: -webkit-box;
        -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        color: #666; line-height: 1.4; text-align: left;
      }
      .memo-cell:hover { color: #3498db; }
      .memo-empty { color: #ccc; }

      .diff-plus { color: #27ae60; font-weight: bold; }
      .diff-minus { color: #e74c3c; font-weight: bold; }
      .company-done td { opacity: 0.45; }
      .company-done td:first-child { text-decoration: line-through; }
      .loading { text-align: center; padding: 48px; color: #999; font-size: 14px; }

      .btn-juchu:hover { opacity: 0.85; }
