  <!DOCTYPE html>                                                                                                                                                                                              
  <html>                                                                                                                                                                                                       
  <head>                                                                                                                                                                                                       
    <meta charset="UTF-8">
    <title>物理ギフトカード 進捗ダッシュボード</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Hiragino Sans', 'メイリオ', sans-serif; background: #f5f7fa; color: #333; }

      header {
        background: #2c3e50; color: white;
        padding: 16px 24px;
        display: flex; align-items: center; justify-content: space-between;
      }
      header h1 { font-size: 18px; }

      .controls { padding: 16px 24px; display: flex; gap: 12px; align-items: center; }
      .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
      .btn-primary { background: #3498db; color: white; }
      .btn-secondary { background: #ecf0f1; color: #333; }
      .btn-success { background: #27ae60; color: white; }
      .btn:hover { opacity: 0.85; }

      .stats { display: flex; gap: 16px; padding: 0 24px 16px; }
      .stat-card { background: white; border-radius: 8px; padding: 12px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); text-align: center; }
      .stat-card .num { font-size: 28px; font-weight: bold; }
      .stat-card .label { font-size: 11px; color: #999; margin-top: 2px; }
      .num-弊社ボール { color: #e74c3c; }
      .num-先方待ち { color: #e6ac00; }
      .num-完了社 { color: #27ae60; }

      .table-wrap { padding: 0 24px 24px; overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
      th { background: #2c3e50; color: white; padding: 10px 12px; font-size: 12px; text-align: center; white-space: nowrap; }
      th:first-child { text-align: left; min-width: 150px; }
      td { padding: 8px 12px; border-bottom: 1px solid #ecf0f1; text-align: center; font-size: 12px; }
      td:first-child { text-align: left; font-weight: bold; }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: #f8f9fa; }

      .badge {
        display: inline-block; padding: 4px 10px; border-radius: 12px;
        font-size: 11px; font-weight: bold; cursor: pointer; user-select: none;
        transition: transform 0.1s; white-space: nowrap;
      }
      .badge:hover { transform: scale(1.05); }
      .badge:active { transform: scale(0.95); }
      .badge-未着手 { background: #e0e0e0; color: #666; }
      .badge-弊社ボール { background: #e74c3c; color: white; }
      .badge-先方待ち { background: #f1c40f; color: #333; }
      .badge-完了 { background: #2ecc71; color: white; }

      .company-done td { opacity: 0.45; }
      .company-done td:first-child { text-decoration: line-through; }

      .loading { text-align: center; padding: 48px; color: #999; font-size: 14px; }

      .modal-overlay {
        display: none; position: fixed; top:0; left:0; right:0; bottom:0;
        background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center;
      }
      .modal-overlay.show { display: flex; }
      .modal { background: white; padding: 24px; border-radius: 8px; min-width: 300px; }
      .modal h2 { margin-bottom: 12px; font-size: 16px; }
      .modal p { font-size: 12px; color: #999; margin-bottom: 12px; }
      .modal input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
      .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    </style>
  </head>
  <body>

  <header>
    <h1>物理ギフトカード 進捗ダッシュボード</h1>
    <div style="font-size:12px;opacity:0.7" id="lastUpdated"></div>
  </header>

  <div class="controls">
    <button class="btn btn-success" onclick="openAddModal()">＋ 事業者を追加</button>
    <button class="btn btn-secondary" id="toggleBtn" onclick="toggleCompleted()">完了済みを表示</button>
  </div>

  <div class="stats" id="statsArea"></div>

  <div class="table-wrap">
    <div class="loading" id="loading">読み込み中...</div>
    <table id="dashTable" style="display:none">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="tokenModal">
    <div class="modal">
      <h2>GitHubトークンを入力</h2>
      <p>初回のみ必要です。ブラウザに保存されます。</p>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" />
      <div class="modal-btns">
        <button class="btn btn-primary" onclick="saveToken()">保存して開始</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>事業者を追加</h2>
      <input type="text" id="newCompanyName" placeholder="事業者名を入力" />
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeAddModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="addCompany()">追加</button>
      </div>
    </div>
  </div>

  <script>
    var GIST_ID = '2bf253d3446c8999d088826891a2073c';
    var STATUSES = ['未着手', '弊社ボール', '先方待ち', '完了'];
    var TASKS = ['発行枚数確定', 'デザイン数確定', '見積もり送付', '発注書締結', '商品登録', 'URL発行・共有', 'デザイン共有', '印刷会社へ発注', '納品'];
    var allData = [];
    var showCompleted = false;
    var token = '';

    function init() {
      token = localStorage.getItem('gh_token') || '';
      if (!token) {
        document.getElementById('tokenModal').classList.add('show');
        return;
      }
      loadData();
    }

    function saveToken() {
      var t = document.getElementById('tokenInput').value.trim();
      if (!t) { alert('トークンを入力してください'); return; }
      localStorage.setItem('gh_token', t);
      token = t;
      document.getElementById('tokenModal').classList.remove('show');
      loadData();
    }

    function loadData() {                                                                                                                                                                                    
        document.getElementById('loading').textContent = '読み込み中...';                                                                                                                                      
        fetch('https://api.github.com/gists/' + GIST_ID, {                                                                                                                                                     
          headers: { 'Authorization': 'token ' + token }
        })
        .then(function(r) {
          console.log('HTTPステータス:', r.status);
          return r.text();
        })
        .then(function(text) {
          console.log('レスポンス:', text.substring(0, 300));
          var data = JSON.parse(text);
          var content = data.files['data.json'].content;
          var parsed = JSON.parse(content);
          allData = parsed.companies || [];
          render();
          document.getElementById('loading').style.display = 'none';
          document.getElementById('dashTable').style.display = 'table';
          updateTime();
        })
        .catch(function(e) {
          document.getElementById('loading').textContent = 'エラー詳細: ' + e.message;
        });
      }

    function saveData() {
      return fetch('https://api.github.com/gists/' + GIST_ID, {
        method: 'PATCH',
        headers: {
          'Authorization': 'token ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          files: {
            'data.json': {
              content: JSON.stringify({ companies: allData }, null, 2)
            }
          }
        })
      });
    }

    function isAllDone(company) {
      return TASKS.every(function(t) { return company.tasks[t] === '完了'; });
    }

    function render() {
      renderStats();
      renderTable();
    }

    function renderStats() {
      var active = allData.filter(function(c) { return !isAllDone(c); });
      var ourBall = 0, waiting = 0;
      active.forEach(function(c) {
        TASKS.forEach(function(t) {
          if (c.tasks[t] === '弊社ボール') ourBall++;
          if (c.tasks[t] === '先方待ち') waiting++;
        });
      });
      var doneCount = allData.filter(isAllDone).length;

      document.getElementById('statsArea').innerHTML =
        '<div class="stat-card"><div class="num num-弊社ボール">' + ourBall + '</div><div class="label">弊社ボール</div></div>' +
        '<div class="stat-card"><div class="num num-先方待ち">' + waiting + '</div><div class="label">先方待ち</div></div>' +
        '<div class="stat-card"><div class="num num-完了社">' + doneCount + '</div><div class="label">完了事業者</div></div>';
    }

    function renderTable() {
      var headHtml = '<tr><th>事業者名</th>';
      TASKS.forEach(function(t) { headHtml += '<th>' + t + '</th>'; });
      headHtml += '</tr>';
      document.getElementById('tableHead').innerHTML = headHtml;

      var filtered = allData.filter(function(c) { return showCompleted || !isAllDone(c); });
      var bodyHtml = '';

      filtered.forEach(function(c) {
        bodyHtml += '<tr class="' + (isAllDone(c) ? 'company-done' : '') + '">';
        bodyHtml += '<td>' + esc(c.name) + ' <button onclick="deleteCompany(\'' + escAttr(c.name) + '\')" style="float:right;background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;"title="削除">×</button></td>';
        TASKS.forEach(function(t) {
          var s = c.tasks[t] || '未着手';
          bodyHtml += '<td><span class="badge badge-' + s + '" onclick="cycleStatus(\'' + escAttr(c.name) + '\',\'' + escAttr(t) + '\',this)">' + s + '</span></td>';
        });
        bodyHtml += '</tr>';
      });

      if (!filtered.length) {
        bodyHtml = '<tr><td colspan="' + (TASKS.length + 1) + '" style="text-align:center;padding:32px;color:#999">事業者がいません</td></tr>';
      }
      document.getElementById('tableBody').innerHTML = bodyHtml;
    }

    function cycleStatus(name, task, el) {
      var idx = STATUSES.indexOf(el.textContent);
      var next = STATUSES[(idx + 1) % STATUSES.length];
      el.textContent = next;
      el.className = 'badge badge-' + next;

      var company = allData.find(function(c) { return c.name === name; });
      if (company) company.tasks[task] = next;
      renderStats();
      if (!showCompleted && isAllDone(company)) renderTable();

      saveData().catch(function(e) { alert('保存失敗: ' + e.message); });
      updateTime();
    }

    function toggleCompleted() {
      showCompleted = !showCompleted;
      document.getElementById('toggleBtn').textContent = showCompleted ? '完了済みを非表示' : '完了済みを表示';
      renderTable();
    }

    function openAddModal() {
      document.getElementById('newCompanyName').value = '';
      document.getElementById('addModal').classList.add('show');
      setTimeout(function() { document.getElementById('newCompanyName').focus(); }, 100);
    }

    function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
    function deleteCompany(name) {
      if (!confirm(name + ' を削除しますか？')) return;
      allData = allData.filter(function(c) { return c.name !== name; });
      render();
      saveData().catch(function(e) { alert('保存失敗: ' + e.message); });
    }

    function addCompany() {
      var name = document.getElementById('newCompanyName').value.trim();
      if (!name) { alert('事業者名を入力してください'); return; }
      if (allData.some(function(c) { return c.name === name; })) { alert('すでに存在します'); return; }

      var newC = { name: name, tasks: {} };
      TASKS.forEach(function(t) { newC.tasks[t] = '未着手'; });
      allData.push(newC);
      render();
      closeAddModal();
      saveData().catch(function(e) { alert('保存失敗: ' + e.message); });
    }

    function updateTime() {
      document.getElementById('lastUpdated').textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

    document.getElementById('newCompanyName').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addCompany();
      if (e.key === 'Escape') closeAddModal();
    });

    document.getElementById('tokenInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') saveToken();
    });

    init();
  </script>
  </body>
  </html>
